quarkus.http.port=8081

# Configuração do Banco de Dados PostgreSQL
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER:petshop}
quarkus.datasource.password=${DB_PASS:petshop}
quarkus.datasource.jdbc.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:petshop_db}
quarkus.hibernate-orm.database.generation=update

# Jacoco Test Coverage Configuration
quarkus.jacoco.report=true
quarkus.jacoco.minimum-line-coverage=0.5

# Configuração do RabbitMQ
rabbitmq-host=${RABBITMQ_HOST:localhost}
rabbitmq-port=${RABBITMQ_PORT:5672}
rabbitmq-username=${RABBITMQ_USER:guest}
rabbitmq-password=${RABBITMQ_PASS:guest}

# Canal de envio de eventos de Cliente
mp.messaging.outgoing.client-created.connector=smallrye-rabbitmq
mp.messaging.outgoing.client-created.exchange.name=client-events

# Canal de envio de eventos de Animal
mp.messaging.outgoing.animal-created.connector=smallrye-rabbitmq
mp.messaging.outgoing.animal-created.exchange.name=animal-events

# Configurações exclusivas para o perfil de Testes
%test.quarkus.datasource.db-kind=postgresql
%test.quarkus.datasource.devservices.enabled=true
%test.quarkus.hibernate-orm.database.generation=drop-and-create
%test.quarkus.rabbitmq.devservices.enabled=false